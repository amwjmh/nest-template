services:
  next-app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - mysql-container
      - redis-container
    ports:
      - 3000:3000
    networks:
      - common-network
  mysql-container:
    image: mysql
    ports:
      - 3306:3306 
    environment:
      MYSQL_DATABASE: nest
      MYSQL_ROOT_USER: root
      MYSQL_ROOT_PASSWORD: root
    networks:
      - common-network
  redis-container:
    image: redis
    ports:
      - 6379:6379
    volumes:
      - /Users/hs/redis⁠:/data
    networks:
      - common-network
networks:
  common-network:
    driver: bridge
    name: common-nextwork